    --azul-d:#7CC0FF; --azul-t:#0F2740; --viol-t:#291640; --ambar-t:#3A2A0C;
    --ink:#F3EFE6; --ink2:#CFC8BA; --mut:#9A9386;
    --line:#2C2A26; --line2:#3D3A34;
    --surf:#1B1A18; --surf2:#211F1C; --ground:#111110;
    --lock:#2C2A26; --lock-d:#1F1E1B; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--texto);
  font-size:16px; line-height:1.5; overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3,h4,.disp,button,.num{font-family:var(--redondo);font-weight:800;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
button{font-size:inherit;color:inherit;touch-action:manipulation}
:focus-visible{outline:3px solid var(--verde);outline-offset:3px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ SHELL ============ */
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--ground);position:relative;
     display:flex;flex-direction:column}
.scroll{flex:1;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.pad{padding-top:14px}
.hud{position:sticky;top:0;z-index:40;background:var(--surf);border-bottom:2px solid var(--line);
     padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px}
.hud .chip{display:flex;align-items:center;gap:5px;font-family:var(--redondo);font-weight:800;font-size:16px}
.hud .spacer{flex:1}
.pill{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;font-family:var(--texto);white-space:nowrap}

.tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;pointer-events:none}
.tabs-in{width:100%;max-width:520px;background:var(--surf);border-top:2px solid var(--line);
     display:grid;grid-template-columns:repeat(5,1fr);pointer-events:auto;
     padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{background:none;border:0;padding:7px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;
     cursor:pointer;border-radius:14px;font-size:10.5px;font-family:var(--texto);font-weight:800;color:var(--mut);letter-spacing:.02em}
.tab svg{width:24px;height:24px;stroke-width:2.3;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--verde-d);background:var(--verde-t)}

/* ============ BOTONES ============ */
.b{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:17px;font-weight:800;
   cursor:pointer;transition:transform .06s,box-shadow .06s;text-align:center;font-family:var(--redondo);letter-spacing:.01em}
.b:active:not(:disabled){transform:translateY(4px);box-shadow:none!important}
.b:disabled{opacity:.45;cursor:not-allowed}
.b-verde{background:var(--verde);color:#1a140a;box-shadow:var(--sh) var(--verde-s)}
.b-viol{background:var(--viol);color:#fff;box-shadow:var(--sh) var(--viol-d)}
.b-azul{background:var(--azul);color:#04203a;box-shadow:var(--sh) var(--azul-d)}
.b-coral{background:var(--coral);color:#fff;box-shadow:var(--sh) var(--coral-s)}
.b-ambar{background:var(--ambar);color:#3a2100;box-shadow:var(--sh) var(--ambar-d)}
.b-ghost{background:var(--surf);color:var(--ink2);border:2px solid var(--line2);box-shadow:var(--sh) var(--line2)}
.b-sm{padding:11px 14px;font-size:15px;border-radius:13px}

/* ============ TARJETAS ============ */
.card{background:var(--surf);border:2px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--mut);font-family:var(--texto)}
.mut{color:var(--mut)}
.row{display:flex;align-items:center;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
hr.sep{border:0;border-top:2px solid var(--line);margin:14px 0}
.stat{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:11px 12px}
.stat .k{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-family:var(--texto)}
.stat .v{font-size:23px;font-family:var(--redondo);font-weight:800;line-height:1.15;margin-top:2px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:800;font-family:var(--texto)}
.srcnote{font-size:11.5px;color:var(--mut);line-height:1.5;padding:12px 2px 4px}
.srcnote a{color:inherit}

/* mascota */
.coach{display:flex;gap:10px;align-items:flex-end;margin:4px 0 14px}
.coach .av{flex:0 0 58px;height:58px;border-radius:50%;background:var(--verde);display:grid;place-items:center;font-size:32px;
     box-shadow:0 4px 0 var(--verde-s)}
.coach .bub{flex:1;background:var(--surf);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:11px 14px;
     font-weight:700;font-size:15px;line-height:1.4}
.coach .bub b{color:var(--verde-d)}

/* ============ RUTA ============ */
.unitband{border-radius:var(--r);padding:14px 16px;margin:16px 0 6px;color:#fff;position:relative;overflow:hidden}
.unitband h3{font-size:20px;color:#fff}
.unitband .eyebrow{color:rgba(255,255,255,.85)}
.unitband .bar{height:8px;border-radius:99px;background:rgba(255,255,255,.28);margin-top:10px;overflow:hidden}
.unitband .bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.node{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.node:active .disc{transform:translateY(5px);box-shadow:none}
.node .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:30px;
      box-shadow:0 6px 0 var(--dd);background:var(--cc);transition:transform .08s,box-shadow .08s;position:relative}
.node .lbl{font-size:12px;font-weight:800;color:var(--ink2);max-width:150px;text-align:center;line-height:1.25}
.node.pend .disc{background:var(--lock);box-shadow:0 6px 0 var(--lock-d)}
.node .crown{position:absolute;top:-11px;right:-6px;font-size:20px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.node .chk{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:var(--surf);
      border:2px solid var(--line);border-radius:99px;font-size:10px;font-weight:800;padding:1px 7px;font-family:var(--texto);white-space:nowrap;color:var(--ink2)}
.pulse{animation:pl 2.2s ease-in-out infinite}
@keyframes pl{0%,100%{box-shadow:0 6px 0 var(--dd),0 0 0 0 rgba(176,141,87,.5)}50%{box-shadow:0 6px 0 var(--dd),0 0 0 13px rgba(176,141,87,0)}}

/* ============ LECCIÓN ============ */
#lesson,#deck,#kick{position:fixed;inset:0;z-index:90;background:var(--ground);display:none;flex-direction:column}
#deck{z-index:92} #kick{z-index:94;background:#07130c}
#lesson.on,#deck.on,#kick.on{display:flex}
.lhead{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 8px;max-width:520px;margin:0 auto;width:100%}
.xbtn{background:none;border:0;font-size:28px;color:var(--mut);cursor:pointer;line-height:1;padding:0 4px;font-weight:700}
/* el progreso es un drive: el balón avanza hacia la end zone */
.drive{flex:1;height:22px;border-radius:8px;position:relative;overflow:visible;
   background:repeating-linear-gradient(90deg,var(--cesped) 0 10%,var(--cesped2) 10% 20%);border:2px solid rgba(255,255,255,.0)}
.drive::before{content:"";position:absolute;inset:0;border-radius:8px;
   background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.55) calc(10% - 1px) 10%)}
.drive .ez{position:absolute;right:0;top:0;bottom:0;width:10%;border-radius:0 8px 8px 0;background:var(--ezc,#046A38);
   display:grid;place-items:center;font-size:8px;color:#fff;font-weight:800}
.drive .ball{position:absolute;top:50%;font-size:20px;line-height:1;transform:translate(-50%,-52%);
   transition:left .5s cubic-bezier(.34,1.4,.64,1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35));font-style:normal}
.lbody{flex:1;overflow-y:auto;padding:10px 16px 250px;max-width:520px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
.qtag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
      padding:4px 9px;border-radius:99px;margin-bottom:10px;font-family:var(--texto)}
.qtext{font-size:19.5px;font-weight:700;line-height:1.4;margin:0 0 16px;font-family:var(--texto)}
.opt{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:var(--surf);
     border:2px solid var(--line2);border-bottom-width:4px;border-radius:15px;padding:13px 14px;margin-bottom:10px;
     cursor:pointer;font-size:16px;font-weight:700;font-family:var(--texto);line-height:1.4;color:var(--ink);transition:background .12s,border-color .12s}
.opt:active:not(:disabled){transform:translateY(2px);border-bottom-width:2px;margin-bottom:12px}
.opt kbd{flex:0 0 25px;height:25px;border-radius:7px;border:2px solid var(--line2);display:grid;place-items:center;
     font-size:12px;font-family:var(--redondo);font-weight:800;background:transparent;color:var(--mut);margin-top:1px}
.opt.ok{background:var(--bien-t);border-color:var(--bien);color:var(--bien-d)}
.opt.ok kbd{border-color:var(--bien);color:var(--bien-d)}
.opt.ko{background:var(--coral-t);border-color:var(--coral);color:var(--coral-d)}
.opt.ko kbd{border-color:var(--coral);color:var(--coral-d)}
.opt:disabled{cursor:default}
.vf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vf .opt{justify-content:center;text-align:center;font-family:var(--redondo);font-size:18px;padding:18px 10px}
.vf .opt kbd{display:none}
/* parejas */
.pares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pares .col{display:flex;flex-direction:column;gap:9px}
.par{background:var(--surf);border:2px solid var(--line2);border-bottom-width:4px;border-radius:14px;padding:10px 9px;min-height:58px;
     font-family:var(--texto);font-weight:800;font-size:13.5px;line-height:1.25;cursor:pointer;color:var(--ink);display:grid;place-items:center;text-align:center}
.par.sel{background:var(--azul-t);border-color:var(--azul);color:var(--azul-d)}
.par.ok{background:var(--bien-t);border-color:var(--bien);color:var(--bien-d);opacity:.6;cursor:default}
.par.ko{background:var(--coral-t);border-color:var(--coral);color:var(--coral-d);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.lfoot,.dfoot{position:fixed;bottom:0;left:0;right:0;z-index:95;display:flex;justify-content:center}
.lfoot-in,.dfoot-in{width:100%;max-width:520px;background:var(--surf);border-top:2px solid var(--line);
     padding:14px 16px calc(16px + env(safe-area-inset-bottom));transition:background .22s,border-color .22s}
.lfoot-in:empty{display:none}
.dfoot-in{display:flex;gap:10px}
.sheet.up{animation:sup .3s cubic-bezier(.2,1.1,.4,1)}
@keyframes sup{from{transform:translateY(34px);opacity:.35}to{transform:none;opacity:1}}
.sheet.ok{background:var(--bien-t);border-top-color:var(--bien)}
.sheet.ko{background:var(--coral-t);border-top-color:var(--coral)}
.fbtitle{font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap;font-family:var(--redondo);font-weight:800}
.fbline{font-size:14.5px;line-height:1.5;margin:7px 0;font-family:var(--texto)}
.fbline b{font-weight:800}
.fbscroll{max-height:40vh;overflow-y:auto;margin-bottom:12px;overscroll-behavior:contain}
.tms{display:flex;gap:4px}
.tms i{width:22px;height:22px;border-radius:7px;background:var(--ambar);display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:800;color:#3a2100;font-family:var(--redondo)}
.tms i.off{background:var(--line);color:var(--mut)}

/* ============ TEORÍA ============ */
.dots{flex:1;display:flex;gap:5px;align-items:center}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--line);transition:background .3s}
.dots i.on{background:var(--verde)}
.skip{background:none;border:0;color:var(--mut);font-family:var(--texto);font-weight:800;font-size:13px;cursor:pointer;padding:4px}
.dbody{flex:1;overflow-y:auto;padding:6px 16px 130px;max-width:520px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
.tcard{background:var(--surf);border:2px solid var(--line);border-radius:22px;padding:20px 18px;box-shadow:0 4px 0 var(--line)}
.tcard h3{font-size:23px;margin:0 0 12px;line-height:1.2}
.tcard p{font-size:15.5px;line-height:1.55;margin:12px 0 0;font-family:var(--texto);font-weight:600;color:var(--ink2)}
.tcard p b{color:var(--ink);font-weight:800}
.tkey{background:var(--verde-t);color:var(--verde-d);border-radius:15px;padding:14px 16px;font-family:var(--redondo);
      font-weight:800;font-size:19px;line-height:1.3;text-align:center;margin-top:10px}
.tvs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.tvs>div{border-radius:15px;padding:13px 12px;border:2px solid}
.tvs h4{font-size:15.5px;margin:0 0 8px}
.tvs ul{margin:0;padding-left:16px;font-size:13.5px;line-height:1.45;font-weight:700;font-family:var(--texto)}
.tvs li{margin-bottom:5px}
.tflow{display:flex;flex-direction:column;gap:0}
.tflow div{display:flex;align-items:flex-start;gap:11px;font-size:14.5px;font-weight:700;font-family:var(--texto);line-height:1.45}
.tflow b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--verde);color:#fff;display:grid;place-items:center;
     font-family:var(--redondo);font-size:14px}
.tflow span.ar{flex:0 0 26px;text-align:center;color:var(--line2);font-size:17px;line-height:1;padding:3px 0}
.tlist{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.tlist div{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;font-weight:700;font-family:var(--texto);line-height:1.4;
     background:var(--surf2);border-radius:12px;padding:10px 12px;border:2px solid var(--line)}
.tlist em{font-style:normal;flex:0 0 auto;font-size:17px;line-height:1.3}

/* ============ VISUALES ============ */
.vis{margin:0 0 14px}
.vis svg{width:100%;height:auto;display:block;border-radius:12px}
.vis .cap{font-size:12.5px;font-weight:800;color:var(--mut);text-align:center;margin-top:6px;font-family:var(--texto)}
.refbox{background:var(--surf2);border:2px solid var(--line);border-radius:16px;padding:8px;display:flex;justify-content:center;gap:8px}
.refbox svg{width:auto;height:150px;border-radius:0}
.refbox.duo svg{height:128px}
.marc{background:#0B0F0D;border-radius:14px;padding:12px 14px;color:#fff;font-family:ui-monospace,"SF Mono",Menlo,monospace;border:3px solid #2a332e}
.marc .sc{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.04em}
.marc .sc b{font-size:28px;color:#FFD028;font-variant-numeric:tabular-nums}
.marc .dn{text-align:center;font-size:30px;font-weight:800;color:#FFD028;letter-spacing:.03em;line-height:1.15}
.marc .sub{display:flex;justify-content:center;gap:14px;font-size:12.5px;color:#9fb3a6;margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.marc .sc+.dn,.marc .sc+.sub{margin-top:6px;border-top:1px solid #2a332e;padding-top:6px}

/* ============ KICKER ============ */
.khead{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 6px;max-width:520px;margin:0 auto;width:100%;color:#fff}
.khead .xbtn{color:#9fb3a6}
.khead .ttl{flex:1;font-family:var(--redondo);font-weight:800;font-size:17px;line-height:1.15}
.khead .ttl small{display:block;font-family:var(--texto);font-size:12px;color:#9fb3a6;font-weight:700}
.kbody{flex:1;max-width:520px;margin:0 auto;width:100%;padding:0 12px;display:flex;flex-direction:column;min-height:0}
#kscene{width:100%;flex:1;min-height:0;display:block}
.kpanel{padding:10px 4px calc(16px + env(safe-area-inset-bottom));color:#fff}
.kmsg{text-align:center;font-family:var(--redondo);font-weight:800;font-size:18px;line-height:1.2;min-height:44px;margin-bottom:6px;display:grid;place-items:center}
.kbar{height:30px;border-radius:99px;background:#22332a;position:relative;overflow:hidden;margin-bottom:10px;border:2px solid #34493d}
.kbar .zone{position:absolute;top:0;bottom:0;background:var(--verde);opacity:.9}
.kbar .mk{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;border-radius:4px;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.8)}
.kbar .lbl{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:800;letter-spacing:.1em;color:rgba(255,255,255,.75);text-transform:uppercase;font-family:var(--texto);pointer-events:none}
.kbar.dim{opacity:.35}
.klives{display:flex;gap:4px;font-size:15px}

/* ============ VARIOS ============ */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:99;width:100%;height:100%}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--surf);
   padding:10px 16px;border-radius:14px;font-weight:800;font-size:14px;font-family:var(--texto);display:none;max-width:88vw;text-align:center}
.tog{display:flex;gap:4px;background:var(--line);padding:4px;border-radius:13px;margin-bottom:12px}
.tog button{flex:1;border:0;background:none;padding:8px 2px;border-radius:10px;font-size:12.5px;font-weight:800;
     font-family:var(--texto);cursor:pointer;color:var(--mut)}
.tog button.on{background:var(--surf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
input[type=text],input[type=search]{width:100%;padding:13px 14px;border:2px solid var(--line2);border-radius:13px;background:var(--surf);
     color:var(--ink);font-family:var(--texto);font-weight:700;font-size:17px;-webkit-appearance:none;appearance:none}
.fade{animation:fi .32s ease}
@keyframes fi{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
.pop{animation:po .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes po{from{transform:scale(.82);opacity:0}to{transform:scale(1);opacity:1}}
.ring{display:block;margin:0 auto}
.gl{display:flex;flex-direction:column;gap:8px}
.gl>div{background:var(--surf);border:2px solid var(--line);border-radius:14px;padding:10px 13px}
.gl b{font-family:var(--redondo);font-size:16.5px}
.gl span{display:block;font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.4}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sig>div{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:10px 8px 12px;text-align:center}
.sig svg{height:118px;width:auto}
.sig b{display:block;font-family:var(--redondo);font-size:15.5px;line-height:1.15;margin-top:4px}
.sig span{display:block;font-size:12px;font-weight:700;color:var(--mut);line-height:1.3;margin-top:3px}
.ins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ins>div{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;font-size:11.5px;font-weight:800;line-height:1.25}
.ins>div i{display:block;font-size:28px;font-style:normal;margin-bottom:3px}
.ins>div.no{opacity:.38;filter:grayscale(1)}
.diploma{border:3px solid var(--oro);border-radius:20px;padding:20px 16px;text-align:center;background:linear-gradient(160deg,var(--surf),var(--verde-t));margin-bottom:12px}
.diploma h3{font-size:24px;margin:6px 0}
.gamecard{border-radius:var(--r);padding:16px;margin-bottom:12px;color:#fff;background:linear-gradient(135deg,#1A1A1A,#3A332A);position:relative;overflow:hidden}

.drive{background:var(--line);border:0;height:14px;border-radius:99px;overflow:hidden}

.volver{display:flex;gap:10px;margin-top:4px}
.volver a{flex:1;text-decoration:none}

.boleto .tp{font-family:var(--redondo);font-weight:800;font-size:26px;line-height:1;display:flex;justify-content:space-between;align-items:baseline}
.boleto .tp small{font-size:12px;font-weight:700;opacity:.8;font-family:var(--texto);letter-spacing:.06em;text-transform:uppercase}
.boleto dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 0 0}
.boleto dt{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;opacity:.75}
.boleto dd{margin:0;font-family:var(--redondo);font-weight:800;font-size:18px;line-height:1.15}
/* gráfico de ganancia y pérdida */
.pago{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:8px 6px 4px}
.pago svg{border-radius:0}

.cad{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums;background:var(--surf2);border:2px solid var(--line);border-radius:14px;overflow:hidden;border-spacing:0}
.cad caption{caption-side:top;text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);padding:0 2px 6px}
.cad th{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);padding:8px 6px;text-align:right}
.cad td{padding:9px 6px;text-align:right;font-weight:700;border-top:2px solid var(--line);color:var(--ink2)}
.cad td.k,.cad th.k{text-align:center;color:var(--verde-d);font-weight:800}
.cad .hl{background:var(--verde-t);color:var(--ink)}

.rango{background:var(--surf2);border:2px solid var(--line);border-radius:14px;padding:14px 14px 10px}
.rango .pista{position:relative;height:30px;background:var(--line);border-radius:99px}
.rango .zona{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--verde);opacity:.85}
.rango .hoy{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.rango .ej{display:flex;justify-content:space-between;font-size:12.5px;font-weight:800;margin-top:7px;color:var(--ink2)}
.rango .ej b{color:var(--ink);font-family:var(--redondo);font-size:15px}

.reto-q b{color:var(--verde-d)}
.reto-pos{background:var(--surf);border:2px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:12px}
.reto-pos h4{font-size:18px;margin:2px 0 4px}
.reto-pos p{margin:0;font-size:14px;font-weight:600;color:var(--ink2);line-height:1.45}
.reto-res{border-radius:16px;padding:13px 15px;margin-bottom:12px;border:2px solid}
.reto-res.ok{background:var(--bien-t);border-color:var(--bien)}
.reto-res.ko{background:var(--coral-t);border-color:var(--coral)}
.reto-res h4{font-size:19px;margin:0 0 4px}
.reto-res p{margin:4px 0 0;font-size:14px;font-weight:600;line-height:1.45}
.vidas{display:flex;gap:4px;font-size:17px}
.vidas span.off{opacity:.25;filter:grayscale(1)}
.chk{list-style:none;margin:8px 0 0;padding:0}
.chk li{position:relative;padding:9px 0 9px 28px;font-size:14.5px;font-weight:700;line-height:1.4;border-top:2px solid var(--line)}
.chk li:first-child{border-top:0}
.chk li::before{content:"✓";position:absolute;left:3px;top:8px;color:var(--bien);font-weight:800}
.mapa{width:100%;border-collapse:collapse;font-size:14px}
.mapa td{padding:9px 6px 9px 0;border-top:2px solid var(--line);vertical-align:top;font-weight:600;color:var(--ink2);line-height:1.35}
.mapa tr:first-child td{border-top:0}
.mapa td:first-child{font-weight:800;color:var(--ink);width:48%}
#reto{position:fixed;inset:0;z-index:94;background:var(--ground);display:none;flex-direction:column}
#reto.on{display:flex}
.comp{font-variant-numeric:tabular-nums}
.comp th{font-size:10px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--mut);text-align:right;padding:0 0 6px 4px;line-height:1.2;vertical-align:bottom}
.comp td{font-size:13px;padding:9px 0 9px 4px;text-align:right;white-space:nowrap;font-weight:800}
.comp td:first-child{text-align:left;width:34%;white-space:normal;padding-left:0}
.comp td.gan{color:var(--bien-d)}
.comp td.per{color:var(--coral-d)}
.vis .comp{margin-bottom:4px}

let AC=null;
function tono(f,d,tipo,vol,cuando){
  if(!S.snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(cuando||0);
    o.type=tipo||'sine'; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol||.12,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}

  tap:()=>{tono(520,.05,'sine',.07)}

/* resultado por acción de una posición si la acción acaba en x */
function resultado(piezas,x){
  let v=0;
  piezas.forEach(l=>{
    if(l.t==='A') v+=l.q*(x-l.p);
    else if(l.t==='C') v+=l.q*(Math.max(x-l.k,0)-l.p);
    else v+=l.q*(Math.max(l.k-x,0)-l.p);
  });
  return v;
}
let GID=0;
function svgPago(piezas,o){
  o=o||{};
  const W=340,H=176,L=8,R=8,T=22,B=30,X0=135,X1=215,id='g'+(++GID);
  const pts=[]; let lo=0,hi=0;
  for(let x=X0;x<=X1+.001;x+=.5){const y=resultado(piezas,x)*100;pts.push([x,y]);if(y<lo)lo=y;if(y>hi)hi=y}
  const m=(hi-lo)*.12||1; lo-=m; hi+=m;
  const sx=x=>L+(x-X0)/(X1-X0)*(W-L-R), sy=y=>T+(hi-y)/(hi-lo)*(H-T-B), y0=sy(0);
  const linea=pts.map((p,i)=>(i?'L':'M')+sx(p[0]).toFixed(1)+' '+sy(p[1]).toFixed(1)).join(' ');
  const area=linea+' L'+sx(X1).toFixed(1)+' '+y0.toFixed(1)+' L'+sx(X0).toFixed(1)+' '+y0.toFixed(1)+' Z';
  const ks=[]; piezas.forEach(l=>{if(l.t!=='A'&&!ks.includes(l.k))ks.push(l.k)});
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ganancia o pérdida según el precio de la acción el día del vencimiento">`;
  s+=`<defs><clipPath id="${id}a"><rect x="0" y="0" width="${W}" height="${y0.toFixed(1)}"/></clipPath><clipPath id="${id}b"><rect x="0" y="${y0.toFixed(1)}" width="${W}" height="${(H-y0).toFixed(1)}"/></clipPath></defs>`;
  s+=`<path d="${area}" fill="var(--bien)" opacity=".25" clip-path="url(#${id}a)"/><path d="${area}" fill="var(--coral)" opacity=".25" clip-path="url(#${id}b)"/>`;
  s+=`<line x1="${L}" x2="${W-R}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--mut)" stroke-width="1" stroke-dasharray="3 3"/>`;
  s+=`<line x1="${sx(SPOT).toFixed(1)}" x2="${sx(SPOT).toFixed(1)}" y1="${T-6}" y2="${H-B}" stroke="var(--mut)" stroke-width="1"/>`;
  s+=`<text x="${sx(SPOT).toFixed(1)}" y="${T-10}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--mut)">hoy ${dec(SPOT,2)}</text>`;
  s+=`<path d="${linea}" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>`;
  ks.forEach(k=>{s+=`<line x1="${sx(k)}" x2="${sx(k)}" y1="${H-B}" y2="${H-B+5}" stroke="var(--mut)"/><text x="${sx(k)}" y="${H-B+17}" text-anchor="middle" font-size="10.5" font-weight="800" fill="var(--ink2)">${String(k).replace('.',',')}</text>`});
  s+=`<text x="${L}" y="${H-3}" font-size="9" font-weight="700" fill="var(--mut)">Precio de la acción el día del vencimiento →</text>`;
  if(o.x!=null){
    const y=resultado(piezas,o.x)*100, cx=sx(o.x), cy=sy(y), col=y>=0?'var(--bien)':'var(--coral)';
    s+=`<line x1="${cx}" x2="${cx}" y1="${T}" y2="${H-B}" stroke="${col}" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="${cx}" cy="${cy}" r="6" fill="${col}" stroke="var(--surf)" stroke-width="2"/>`;
    if(!o.oculto){const tx=Math.min(W-R-4,Math.max(L+4,cx)), anc=cx>W*.7?'end':cx<W*.3?'start':'middle';
      s+=`<text x="${tx}" y="${cy-11>T+14?cy-11:cy+20}" text-anchor="${anc}" font-size="12" font-weight="800" fill="${col}">${y>=0?'+':'−'}${miles(y)} $ con ${px(o.x)}</text>`;}
  }
  s+='</svg>';
  return `<div class="vis"><div class="pago">${s}</div><div class="cap">${esc(o.cap||'Verde: ganas · Rojo: pierdes · Por contrato, sin comisiones')}</div></div>`;
}

/* ---------- Hoy ---------- */
function anillo(pct){
  const r=52,c=2*Math.PI*r,off=c*(1-pct/100);
  return `<svg class="ring" width="132" height="132" viewBox="0 0 132 132" role="img" aria-label="${pct}% completado">
   <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--line)" stroke-width="13"/>
   <circle cx="66" cy="66" r="${r}" fill="none" stroke="var(--verde)" stroke-width="13" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 66 66)" style="transition:stroke-dashoffset 1s"/>
   <text x="66" y="77" text-anchor="middle" font-family="ui-rounded,-apple-system,sans-serif" font-weight="800" font-size="34" fill="var(--ink)">${pct}<tspan font-size="17">%</tspan></text></svg>`;
}
function saludo(){
  const n=S.nombre?`, <b>${esc(S.nombre)}</b>`:'', pg=progreso();
  if(pg.a===0) return `Hola${n}. Empezamos por lo más fácil: <b>qué es una call y qué es una put</b>. Tres minutos.`;
  if(S.fin) return `Diploma en mano${n}. Ahora, a por tu récord en el <b>reto</b>.`;
  if(pg.pct>=100) return `Ruta completa${n}. Solo te queda el <b>examen final</b>.`;
  if(S.fallos.length>=4) return `Tienes <b>${S.fallos.length} ejercicios</b> para repasar${n}. Dos minutos y quedan limpios.`;
  return `Buen ritmo${n}. Llevas <b>${pg.a} de ${TEMAS.length}</b> lecciones. ¿Otra?`;
}
function vHoy(){

  return `<div class="fade">

  ${sig?`<div class="card" style="border-color:${UNIT[sig.u].c}">

    <div style="height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px"><i style="display:block;height:100%;width:${Math.min(100,hy/meta*100)}%;background:var(--verde);border-radius:99px"></i></div>
    ${rg.sig?`<div class="mut" style="font-size:12.5px;font-weight:700;margin-top:10px">Te faltan <b style="color:var(--ink)">${rg.falta} puntos</b> para subir a <b style="color:var(--ink)">${rg.sig}</b>.</div>`:''}

/* ---------- Ruta ---------- */
function vRuta(){
  const sig=siguienteTema();
  let h='<div class="fade">';
  UNITS.forEach((u,ui)=>{
    const ts=TEMAS.filter(t=>t.u===u.id), hechos=ts.filter(t=>lecHecha(t.id)).length, jefe=!!S.jefe[u.id];
    h+=`<div class="unitband" style="background:linear-gradient(135deg,${u.c},${u.d})">
      <div class="eyebrow">Unidad ${ui+1} · ${esc(u.s)}</div><h3>${u.e} ${esc(u.n)}</h3>
      <div class="bar"><i style="width:${Math.round((hechos+(jefe?1:0))/(ts.length+1)*100)}%"></i></div></div><div class="path">`;
    ts.forEach((t,i)=>{
      const ok=lecHecha(t.id), l=S.les[t.id], off=[0,52,0,-52][i%4], next=sig&&sig.id===t.id;
      h+=`<button class="node ${ok||next?'':'pend'}" style="margin-left:${off}px" onclick="lecTema('${t.id}')">
        <div class="disc ${next?'pulse':''}" style="--cc:${u.c};--dd:${u.d}">${t.e}${ok&&l.perf?'<span class="crown">💎</span>':''}${ok?`<span class="chk">✓ ${l.best}%</span>`:''}</div>
        <span class="lbl">${esc(t.n)}</span></button>`;
    });
    const listo=hechos===ts.length;
    h+=`<button class="node ${jefe||listo?'':'pend'}" style="margin-left:${[0,52,0,-52][ts.length%4]}px" onclick="jefeUnidad('${u.id}')">
      <div class="disc" style="--cc:${jefe?'var(--oro)':'#2B2B2B'};--dd:${jefe?'#8C6D3E':'#000'}">${jefe?'🏆':'🏁'}</div>
      <span class="lbl">${jefe?'Examen aprobado':'Examen de la unidad'}</span></button></div>`;
  });
  h+=`<div class="card" style="margin-top:22px;border-color:var(--oro);text-align:center">
    <div style="font-size:44px">🎓</div><h3 style="font-size:22px;margin:4px 0">Examen final</h3>
    <p class="mut" style="font-size:14px;font-weight:700;margin:4px 0 12px">Ejercicios de todas las unidades y solo 3 vidas. Si ya sabes de esto, puedes ir directo.</p>
    <button class="b b-ambar" onclick="examenFinal()">${S.fin?'Repetir el examen final':'Hacer el examen final'}</button></div>
  <p class="srcnote">${esc(FUENTES)}</p></div>`;
  return h;
}

function pintaGlos(){
  const el=$('#gl'); if(!el)return;

}

function cambiarTema(){
  const el=document.documentElement, oscuro=el.getAttribute('data-theme')?el.getAttribute('data-theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const n=oscuro?'light':'dark'; el.setAttribute('data-theme',n); try{localStorage.setItem('theme',n)}catch(e){} render();

function compartir(){
  const pg=progreso(), rg=rango();
  const txt=`📈📉 RUTA OPCIONES — ${S.nombre||'Yo'}: ${rg.n}, ${miles(S.pt)} puntos y ${pg.pct}% de la ruta${S.reto.rec?`; récord de ${S.reto.rec} aciertos en el reto`:''}.${S.fin?' 🎓 Diploma conseguido.':''}`;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('Copiado: pégalo en WhatsApp'),()=>toast(txt))}
  else toast(txt);
}

/* ================= LECCIÓN ================= */
let L=null;
function baraja(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lecTema(tid){
  const run=()=>openL(baraja(QBY[tid]),'lec',{tema:tid,u:TEMA[tid].u});
  if(!S.teo[tid]) showDeck(tid,run); else run();
}
const VIDAS3='<div class="tms" style="justify-content:center;margin-top:14px"><i>♥</i><i>♥</i><i>♥</i></div>';
function jefeUnidad(uid){
  const ts=TEMAS.filter(t=>t.u===uid).map(t=>t.id);
  const qs=baraja(Q.filter(q=>ts.includes(q.t))).slice(0,10);
  intro(`<div class="pop" style="text-align:center;padding-top:26px"><div style="font-size:64px">🏁</div>
    <h2 style="font-size:27px;margin:8px 0">Examen de la unidad</h2>
    <p style="font-weight:700;color:var(--ink2);font-size:15.5px;line-height:1.5">${qs.length} ejercicios de <b>${esc(UNIT[uid].n)}</b>, sin teoría delante.<br>Tienes <b>3 vidas</b>: cada fallo gasta una.<br>Si fallas sin vidas, toca repetirlo.</p>${VIDAS3}</div>`,
    'Empezar el examen',()=>openL(qs,'jefe',{u:uid}));
}
function examenFinal(){
  const qs=[]; UNITS.forEach(u=>{const ts=TEMAS.filter(t=>t.u===u.id).map(t=>t.id);qs.push(...baraja(Q.filter(q=>ts.includes(q.t)&&!q.par)).slice(0,3))});
  intro(`<div class="pop" style="text-align:center;padding-top:26px"><div style="font-size:64px">🎓</div>
    <h2 style="font-size:27px;margin:8px 0">Examen final</h2>
    <p style="font-weight:700;color:var(--ink2);font-size:15.5px;line-height:1.5">${qs.length} ejercicios de todas las unidades.<br><b>3 vidas</b> para todo el examen.<br>Si lo superas, te llevas el <b>diploma</b>.</p>${VIDAS3}</div>`,
    'Empezar el examen final',()=>openL(baraja(qs),'final',{u:'u1'}));
}
function repaso(){
  const qs=S.fallos.map(id=>QID[id]).filter(Boolean);
  if(!qs.length){toast('No tienes fallos pendientes 👌');return}
  openL(baraja(qs).slice(0,8),'repaso',{u:'u2'});
}
function intro(html,btn,cb){
  DK={tid:null,i:0,then:cb};
  $('#deck').classList.add('on'); document.body.style.overflow='hidden';
  $('#dskip').style.visibility='hidden';
  $('#ddots').innerHTML=''; $('#dbody').innerHTML=html; $('#dbody').scrollTop=0;
  $('#dfoot').innerHTML=`<button class="b b-verde" style="flex:1" onclick="finIntro()">${btn}</button>`;
}
function finIntro(){const then=DK&&DK.then;cerrarDeck();if(then)then()}
const esExamen=()=>L.modo==='jefe'||L.modo==='final';

function openL(qs,modo,meta){
  if(!qs.length){toast('No hay ejercicios disponibles');return}
  L={cola:qs.map(q=>({q,rep:0})),tot:qs.length,hechas:0,ok1:0,fallos:0,modo,meta:meta||{},tm:3,pt:0,t0:Date.now(),fase:'q',perdido:false};
  $('#lesson').classList.add('on'); document.body.style.overflow='hidden';
  $('#lteo').style.display=(modo==='lec'&&TEO[L.meta.tema])?'':'none';
  paint();
}
function quitLesson(){
  if(L&&!L.fin&&L.hechas>0&&!confirm('Si sales ahora, esta lección no cuenta. ¿Salir?'))return;
  $('#lesson').classList.remove('on'); $('#sheet').className='lfoot-in sheet'; $('#sheet').innerHTML='';
  document.body.style.overflow=''; L=null; save(); render();
}
function pintaCabecera(){
  $('#lfill').style.width=(L.hechas/L.tot*100)+'%';
  $('#lright').innerHTML=esExamen()
    ?`<div class="tms" title="Vidas">${[0,1,2].map(i=>`<i class="${i<L.tm?'':'off'}">♥</i>`).join('')}</div>`
    :`<span class="pill" style="background:var(--verde-t);color:var(--verde-d)">${L.hechas}/${L.tot}</span>`;
}
function paint(){
  const cur=L.cola[0], q=cur.q, t=TEMA[q.t], u=UNIT[t.u];
  L.fase='q'; pintaCabecera();
  let cuerpo;
  if(q.par){
    L.par={izq:baraja(q.par.map((p,i)=>i)),der:baraja(q.par.map((p,i)=>i)),sel:null,hechos:0,err:0};
    cuerpo=`<div class="pares"><div class="col">${L.par.izq.map(i=>`<button class="par" data-l="${i}" onclick="pickPar('l',${i},this)">${esc(q.par[i][0])}</button>`).join('')}</div>
      <div class="col">${L.par.der.map(i=>`<button class="par" data-r="${i}" onclick="pickPar('r',${i},this)">${esc(q.par[i][1])}</button>`).join('')}</div></div>`;
  } else if(q.vf){
    L.perm=[0,1];
    cuerpo=`<div class="vf" id="opts">${VF.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span>${i?'✗':'✓'} ${o}</span></button>`).join('')}</div>`;
  } else {
    L.perm=baraja(q.o.map((_,i)=>i));
    cuerpo=`<div id="opts">${L.perm.map((oi,i)=>`<button class="opt" onclick="pick(${i})"><kbd>${'ABCD'[i]}</kbd><span>${esc(q.o[oi])}</span></button>`).join('')}</div>`;
  }
  $('#lbody').innerHTML=`<div class="fade">
    <span class="qtag" style="background:${u.d};color:#fff">${t.e} ${esc(t.n)}</span>${cur.rep?'<span class="qtag" style="background:var(--ambar);color:#3a2100;margin-left:5px">🔁 Otra vez</span>':''}${q.vf?'<span class="qtag" style="background:var(--line);color:var(--ink2);margin-left:5px">¿Verdadero o falso?</span>':''}
    ${vis(q.v)}<p class="qtext">${md(q.q)}</p>${cuerpo}</div>`;
  $('#lbody').scrollTop=0;
  const sh=$('#sheet'); sh.className='lfoot-in sheet'; sh.innerHTML='';
}
function pick(i){
  if(!L||L.fase!=='q')return;
  const q=L.cola[0].q, orig=L.perm[i], ok=orig===q.r;
  [...$('#opts').children].forEach((b,j)=>{b.disabled=true; if(L.perm[j]===q.r)b.classList.add('ok'); else if(j===i)b.classList.add('ko')});
  resolver(ok, ok?null:(q.vf?VF[q.r]:q.o[q.r]));
}
function pickPar(lado,i,el){
  if(!L||L.fase!=='q'||el.classList.contains('ok'))return;
  const P=L.par, q=L.cola[0].q;
  if(!P.sel||P.sel.lado===lado){
    document.querySelectorAll('.par.sel').forEach(x=>x.classList.remove('sel'));
    P.sel={lado,i,el}; el.classList.add('sel'); SND.tap(); return;
  }
  const a=P.sel; P.sel=null; a.el.classList.remove('sel');
  if(a.i===i){ a.el.classList.add('ok'); el.classList.add('ok'); P.hechos++; SND.tap();
    if(P.hechos===q.par.length) resolver(P.err<=1,null);
  } else { P.err++; [a.el,el].forEach(x=>{x.classList.add('ko');setTimeout(()=>x.classList.remove('ko'),350)}); SND.ko(); }
}
function resolver(ok,correcta){
  const cur=L.cola[0], q=cur.q; L.fase='fb';
  S.tot++; if(ok)S.ok++;
  let gan=0, extra='';
  if(ok){
    gan=cur.rep?5:10; if(!cur.rep)L.ok1++;
    L.hechas++; L.pt+=gan; sumar(gan);
    S.fallos=S.fallos.filter(id=>id!==q._id);
    SND.ok();
  } else {
    L.fallos++; if(!S.fallos.includes(q._id))S.fallos.push(q._id);
    SND.ko();
    if(esExamen()){
      L.hechas++;
      if(L.tm>0){L.tm--; extra=`<div class="fbline" style="background:var(--ambar);color:#3a2100;border-radius:11px;padding:9px 11px"><b>♥ Una vida menos.</b> Te ${L.tm===1?'queda 1':'quedan '+L.tm}.</div>`}
      else L.perdido=true;
    }
  }
  save(); pintaCabecera();
  const ult=L.perdido||(L.cola.length===1&&(ok||esExamen()||cur.rep>=2));
  const sh=$('#sheet'); sh.className='lfoot-in sheet up '+(ok?'ok':'ko');
  sh.innerHTML=`<div class="fbscroll">
    <div class="fbtitle" style="color:var(--${ok?'bien':'coral'}-d)">${ok?(q.par?'✅ ¡Todas en su sitio!':'✅ ¡Correcto!'):(q.par?'❌ Demasiados cambios':'❌ No era esa')}
      ${ok?`<span class="badge" style="background:var(--bien);color:#fff">+${gan} puntos</span>`:''}</div>
    ${correcta?`<div class="fbline"><b>✅ La buena:</b> ${esc(correcta)}</div>`:''}${extra}
    ${q.w?`<div class="fbline"><b>🎯 Por qué:</b> ${md(q.w)}</div>`:''}
    ${q.k?`<div class="fbline"><b>🧠 Quédate con esto:</b> ${md(q.k)}</div>`:''}
   </div>
   <button class="b b-${ok?'bien':'coral'}" onclick="siguiente(${ok?1:0})">${ult?'Ver resultado':'Siguiente'}</button>`;
}
function siguiente(ok){
  if(!L)return;
  if(L.perdido){finLec();return}
  const cur=L.cola.shift();
  if(!ok&&(L.modo==='lec'||L.modo==='repaso')){
    if(cur.rep<2){cur.rep++;L.cola.push(cur)} else L.hechas++;      // tras dos repeticiones se deja pasar
  }
  if(!L.cola.length)finLec(); else paint();
}
function finLec(){
  L.fin=true; marcarDia();
  const gana=!L.perdido;
  const pc=Math.round(L.ok1/L.tot*100);
  let bonus=0, tit, emo, sub;
  if(L.modo==='lec'){
    bonus=20; const t=L.meta.tema, prev=S.les[t]||{n:0,best:0,perf:false};
    S.les[t]={n:prev.n+1,best:Math.max(prev.best,pc),perf:prev.perf||L.fallos===0};
    tit='¡Lección superada!'; emo='🎯'; sub=`${esc(TEMA[t].n)} · ${L.ok1} de ${L.tot} a la primera`;
  } else if(L.modo==='repaso'){
    bonus=10; tit='Fallos repasados'; emo='🔁'; sub=`${L.ok1} de ${L.tot} a la primera`;
  } else if(gana){
    bonus=L.modo==='final'?100:50; emo='🏆';
    if(L.modo==='final'){S.fin={f:new Date().toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'}),pct:pc};tit='¡Examen final superado!';sub='Diploma conseguido'}
    else {S.jefe[L.meta.u]=1;tit='¡Examen aprobado!';sub=`${esc(UNIT[L.meta.u].n)} · ${L.ok1} de ${L.tot}`}
  } else { tit='Te quedaste sin vidas'; emo='😤'; sub='Repasa los fallos y vuelve a intentarlo.'; }
  sumar(bonus); L.pt+=bonus;
  const nuevas=chkInsig(); save();
  $('#lfill').style.width=(gana?100:L.hechas/L.tot*100)+'%'; $('#lright').innerHTML=''; $('#lteo').style.display='none';
  $('#lbody').innerHTML=`<div class="pop" style="text-align:center;padding:22px 0 10px">
    <div style="font-size:66px">${emo}</div>
    <h2 style="font-size:30px;margin:8px 0 3px">${tit}</h2>
    <p class="mut" style="font-weight:700;margin:0 0 16px">${sub}</p>
    <div class="grid3" style="margin-bottom:14px">
      <div class="stat"><div class="k">Puntos</div><div class="v">+${L.pt}</div></div>
      <div class="stat"><div class="k">Acierto</div><div class="v">${pc}%</div></div>
      <div class="stat"><div class="k">Racha</div><div class="v">🔥${S.racha}</div></div>
    </div>
    ${L.modo==='lec'&&L.fallos===0?'<div class="card" style="border-color:var(--azul);background:var(--azul-t)"><b style="color:var(--azul-d)">💎 Lección perfecta: ni un fallo.</b></div>':''}
    ${nuevas.length?`<div class="card" style="border-color:var(--oro)"><div class="eyebrow">Insignia conseguida</div>${nuevas.map(i=>`<div style="font-size:36px;margin-top:5px">${i.e}</div><b>${esc(i.n)}</b>`).join('')}</div>`:''}
  </div>`;
  const sh=$('#sheet'); sh.className='lfoot-in sheet up '+(gana?'ok':'');
  if(!gana) sh.innerHTML=`<div class="grid2"><button class="b b-ghost" onclick="quitLesson()">Salir</button><button class="b b-coral" onclick="revancha()">Repetir</button></div>`;
  else sh.innerHTML=`<button class="b b-bien" onclick="${L.modo==='final'?"quitLesson();go('yo')":'quitLesson()'}">${L.modo==='final'?'Ver mi diploma':'Continuar'}</button>`;
  if(gana){SND.td();burst(L.modo!=='repaso')}
}
function revancha(){const m=L.modo,u=L.meta.u;L.fin=true;quitLesson();if(m==='final')examenFinal();else jefeUnidad(u)}
function verTeoria(){if(L&&L.meta.tema)showDeck(L.meta.tema)}

/* ================= RETO: ¿GANAS O PIERDES? ================= */
let RT=null;
function abrirReto(){
  RT={vidas:3,ok:0,ult:null,cur:null,fase:'q',nivel:0};
  $('#reto').classList.add('on'); document.body.style.overflow='hidden';
  rondaReto();
}
function cerrarReto(){
  if(!RT)return;
  RT=null; $('#reto').classList.remove('on'); document.body.style.overflow='';
  chkInsig(); save(); render();
}
function rondaReto(){
  const nv=Math.min(RETO_NIVELES.length-1,Math.floor(RT.ok/3)), sube=nv>RT.nivel; RT.nivel=nv;
  let pool=RETO_NIVELES[nv].filter(k=>k!==RT.ult); if(!pool.length)pool=RETO_NIVELES[nv];
  const k=pool[Math.floor(Math.random()*pool.length)], pos=POS[k];
  const xs=[]; for(let x=140;x<=210;x+=2.5){ if(Math.abs(resultado(pos.p,x))>=.4) xs.push(x) }      // fuera los casos casi a cero
  const gan=xs.filter(x=>resultado(pos.p,x)>0), per=xs.filter(x=>resultado(pos.p,x)<0);
  const lado=(gan.length&&per.length)?(Math.random()<.5?gan:per):(gan.length?gan:per);               // mitad y mitad
  const x=lado[Math.floor(Math.random()*lado.length)];
  RT.ult=k; RT.cur={k,x}; RT.fase='q';
  pintaRetoCab();
  $('#rbody').innerHTML=`<div class="fade">
    ${sube?'<span class="qtag" style="background:var(--ambar);color:#3a2100">⬆ Sube el nivel: entran estrategias nuevas</span>':''}
    <div class="reto-pos"><div class="eyebrow">La posición</div><h4>${esc(pos.n)}</h4><p>${esc(pos.d)}</p></div>
    <p class="reto-q">El día del vencimiento, la acción acaba en <b>${px(x)}</b>.<br>¿Ganas o pierdes?</p>
    <p class="mut" style="text-align:center;font-size:12.5px;font-weight:700;margin:0">Hoy la acción está en ${dec(SPOT,2)} $ · Por contrato, sin comisiones</p></div>`;
  $('#rbody').scrollTop=0;
  $('#rfoot').innerHTML=`<div class="grid2"><button class="b b-bien" onclick="respReto(1)">📈 Gano</button><button class="b b-coral" onclick="respReto(0)">📉 Pierdo</button></div>`;
}
function pintaRetoCab(){
  $('#rttl').textContent=`Aciertos: ${RT.ok}`;
  $('#rvidas').innerHTML=[0,1,2].map(i=>`<span class="${i<RT.vidas?'':'off'}">❤️</span>`).join('');
}
function explicaReto(pos,x){
  const l=[];
  pos.p.forEach(z=>{
    if(z.t==='A'){const d=x-z.p; l.push(`Las acciones pasan de ${px(z.p)} a ${px(x)}: ${d>=0?'+':'−'}${dec(d,2)} $ por acción.`); return}
    const nom=(z.t==='C'?'call':'put')+' de '+px(z.k), val=z.t==='C'?Math.max(x-z.k,0):Math.max(z.k-x,0);
    if(z.q>0) l.push(val>0?`La ${nom} vale ${dec(val,2)} $ al final; pagaste ${dec(z.p,2)} $.`:`La ${nom} caduca sin valor; pagaste ${dec(z.p,2)} $.`);
    else l.push(val>0?`La ${nom} que vendiste vale ${dec(val,2)} $ al final: te cuesta eso, y habías cobrado ${dec(z.p,2)} $.`:`La ${nom} que vendiste caduca sin valor: te quedas los ${dec(z.p,2)} $.`);
  });
  const r=resultado(pos.p,x);
  l.push(`Total: ${r>=0?'+':'−'}${dec(r,2)} $ por acción × 100 = ${r>=0?'+':'−'}${miles(r*100)} $.`);
  return l;
}
function respReto(gano){
  if(!RT||RT.fase!=='q')return;
  RT.fase='fb';
  const {k,x}=RT.cur, pos=POS[k], r=resultado(pos.p,x)*100, ok=(r>0)===!!gano;
  S.reto.n++;
  if(ok){RT.ok++; S.reto.ok++; sumar(5); if(RT.ok>S.reto.rec)S.reto.rec=RT.ok; SND.ok()} else {RT.vidas--; SND.ko()}
  marcarDia(); save(); pintaRetoCab();
  const fin=RT.vidas<=0;
  $('#rbody').innerHTML=`<div class="fade">
    <div class="reto-res ${ok?'ok':'ko'}"><h4 style="color:var(--${ok?'bien':'coral'}-d)">${ok?'✅ ¡Correcto!':'❌ Era al revés'} ${r>0?'Ganas':'Pierdes'} ${usd(r)}${ok?' <span class="badge" style="background:var(--bien);color:#fff">+5 puntos</span>':''}</h4>
      ${explicaReto(pos,x).map(t=>`<p>${esc(t)}</p>`).join('')}</div>
    <div class="reto-pos"><div class="eyebrow">${esc(pos.n)}</div><p style="margin-bottom:8px">${esc(pos.d)}</p>${svgPago(pos.p,{x})}</div>
    ${fin?`<div class="card" style="text-align:center;border-color:var(--oro)"><div style="font-size:44px">${RT.ok>=S.reto.rec&&RT.ok>0?'🏆':'🎯'}</div><h3 style="font-size:22px;margin:4px 0">Fin del reto: ${RT.ok} ${RT.ok===1?'acierto':'aciertos'}</h3><p class="mut" style="margin:0;font-weight:700;font-size:14px">Tu récord: ${S.reto.rec}</p></div>`:''}
    </div>`;
  $('#rbody').scrollTop=0;
  if(fin){ const n=chkInsig(); save(); if(RT.ok>=5)burst(RT.ok>=12);
    $('#rfoot').innerHTML=`<div class="grid2"><button class="b b-ghost" onclick="cerrarReto()">Salir</button><button class="b b-verde" onclick="abrirReto()">Otra vez</button></div>`;
    if(n.length)toast('Insignia: '+n.map(i=>i.n).join(', '));
  } else $('#rfoot').innerHTML=`<button class="b b-${ok?'bien':'coral'}" onclick="rondaReto()">Siguiente</button>`;
}

/* ================= CONFETI ================= */
const CV=$('#confetti'), CX=CV.getContext('2d'); let P=[], RUN=false;
function burst(big){
  const W=CV.width=innerWidth, H=CV.height=innerHeight, n=big?130:50;
  const cols=['#B08D57','#C9A86B','#F5F1E8','#1A1A1A','#1C9D63','#2E9BFF'];
  for(let i=0;i<n;i++)P.push({x:W/2+(Math.random()-.5)*W*.5,y:H*.42,vx:(Math.random()-.5)*13,vy:-Math.random()*13-4,s:Math.random()*7+4,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1});
  if(!RUN){RUN=true;requestAnimationFrame(loopC)}
}
function loopC(){
  CX.clearRect(0,0,CV.width,CV.height);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.38;p.vx*=.99;p.r+=p.vr;p.l-=.011;
    CX.save();CX.globalAlpha=Math.max(0,p.l);CX.translate(p.x,p.y);CX.rotate(p.r);CX.fillStyle=p.c;CX.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);CX.restore()});
  P=P.filter(p=>p.l>0&&p.y<CV.height+30);
  if(P.length)requestAnimationFrame(loopC); else{RUN=false;CX.clearRect(0,0,CV.width,CV.height)}
}

/* ================= ARRANQUE ================= */
if(S.hoyDia!==hoy()){S.hoyDia=hoy();S.hoyPt=0}
if(S.ult&&S.ult!==hoy()&&S.ult!==ayer())S.racha=0;      // la racha se rompe si faltó un día entero
render();
// igual que el resto del radar: sin sesión, al login (solo cuando se sirve por http)
if(RADAR_URL&&/^https?:$/.test(location.protocol)) fetch('/api/me').then(r=>{if(r.status===401)location.href='/login.html'}).catch(()=>{});

</script>
